name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }} / ${{ matrix.torch_spec }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # the advertised minimums: Python 3.9, torch 2.0, pytest 7.0 (torch < 2.3 needs numpy < 2)
          - { os: ubuntu-latest, python: "3.9", torch_spec: "torch==2.0.*", extra_pins: '"numpy<2"', pytest_spec: "pytest==7.0.*" }
          - { os: ubuntu-latest, python: "3.9", torch_spec: "torch==2.2.*", extra_pins: '"numpy<2"' }
          - { os: ubuntu-latest, python: "3.10", torch_spec: "torch==2.4.*" }
          - { os: ubuntu-latest, python: "3.12", torch_spec: "torch==2.6.*" }
          - { os: ubuntu-latest, python: "3.13", torch_spec: "torch" }
          - { os: windows-latest, python: "3.12", torch_spec: "torch" }
          # GitHub's macOS runners are VMs whose GPU gives wrong MPS results (NaN, Inf,
          # outputs that change between runs), so test on the CPU there. MPS coverage
          # needs a real Mac (self-hosted runner).
          - { os: macos-latest, python: "3.12", torch_spec: "torch", pytest_args: "--torch-device=cpu" }
    steps:
      - uses: actions/checkout@v4

      # Tip: pin third-party actions to a commit SHA, or bump to the latest major.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Create environment
        run: uv venv

      - name: Install torch (CPU wheels)
        shell: bash
        run: >
          uv pip install "${{ matrix.torch_spec }}" ${{ matrix.extra_pins }}
          --extra-index-url https://download.pytorch.org/whl/cpu
          --index-strategy unsafe-best-match

      - name: Install the project and test dependencies
        run: uv pip install -e . "${{ matrix.pytest_spec || 'pytest' }}" pytest-xdist hypothesis matplotlib pyyaml

      # Dogfooding: annotations on failing tests + mismatch heatmaps as artifacts.
      - name: Run tests
        run: uv run --no-sync pytest tests -ra -m "not slow" --torch-github-annotations --torch-failure-artifacts=failure-artifacts ${{ matrix.pytest_args }}

      - name: Run examples
        run: uv run --no-sync pytest examples -ra -m "not slow" --torch-github-annotations --torch-failure-artifacts=failure-artifacts ${{ matrix.pytest_args }}

      # AOTInductor compiles C++: once, on the newest torch, where g++ is available.
      - name: Run slow tests
        if: matrix.os == 'ubuntu-latest' && matrix.torch_spec == 'torch'
        run: uv run --no-sync pytest tests examples -ra -m slow --torch-github-annotations ${{ matrix.pytest_args }}

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-artifacts-${{ matrix.os }}-py${{ matrix.python }}
          path: failure-artifacts
          if-no-files-found: ignore

  # Model zoos and training frameworks (optional extras), at versions known to work together:
  # Hugging Face loading, hf_tiny, zero-code testing, the Lightning and HF trainer fixtures.
  integrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv venv
      - name: Install torch and the integrations
        run: >
          uv pip install "torch==2.6.*" "torchvision==0.21.*" timm "transformers==4.49.*" "accelerate>=0.26"
          lightning --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match
      - run: uv pip install -e . pytest pytest-xdist hypothesis matplotlib pyyaml
      - run: uv run --no-sync pytest tests examples -ra -m "not slow" --torch-github-annotations

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff@0.17 check src tests examples

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv venv
      - run: uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install -e . mypy pytest hypothesis numpy
      - run: uv run --no-sync mypy  # settings in [tool.mypy]

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
