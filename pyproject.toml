[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "pytest-torch"
version = "0.1.0"
description = "pytest plugin that eases inference testing of PyTorch models"
requires-python = ">=3.9"
dependencies = ["pytest>=7.0"]
classifiers = ["Framework :: Pytest"]

[project.optional-dependencies]
torch = ["torch>=2.0"]

[project.entry-points.pytest11]
pytest_torch = "pytest_torch.plugin"

[dependency-groups]
dev = [
    "black>=25.11.0",
    "torch>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Optional: install CPU-only torch wheels in the dev environment (much smaller,
# faster CI). Leave commented out if you want to test on a GPU locally.
# [tool.uv.sources]
# torch = [{ index = "pytorch-cpu" }]
#
# [[tool.uv.index]]
# name = "pytorch-cpu"
# url = "https://download.pytorch.org/whl/cpu"
# explicit = true

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']
skip-string-normalization = true
skip-magic-trailing-comma = false
exclude = '''
^/(
    \.git
  | \.venv
  | build
  | dist
)
'''