[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "pytest-torch"
version = "0.1.0"
description = "pytest plugin that eases inference testing of PyTorch models"
requires-python = ">=3.9"
dependencies = ["pytest>=7.0"]
classifiers = ["Framework :: Pytest"]

[project.optional-dependencies]
torch = ["torch>=2.0"]

[project.entry-points.pytest11]
pytest_torch = "pytest_torch.plugin"

[dependency-groups]
dev = [
    "numpy>=2.0.2",
    "pydantic>=2.13.5",
    "ruff>=0.17.0",
    "torch>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Optional: install CPU-only torch wheels in the dev environment (much smaller,
# faster CI). Leave commented out if you want to test on a GPU locally.
# [tool.uv.sources]
# torch = [{ index = "pytorch-cpu" }]
#
# [[tool.uv.index]]
# name = "pytorch-cpu"
# url = "https://download.pytorch.org/whl/cpu"
# explicit = true

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']
skip-string-normalization = true
skip-magic-trailing-comma = false
exclude = '''
^/(
    \.git
  | \.venv
  | build
  | dist
)
'''

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors (PEP 8)
    "W",    # pycodestyle warnings
    "F",    # Pyflakes (syntax, undefined names)
    "I",    # isort (clean import sorting)
    "B",    # flake8-bugbear (catches design flaws & bugs)
    "C4",   # flake8-comprehensions (better lists/dicts)
    "UP",   # pyupgrade (upgrades old syntax to target-version)
    "ARG",  # flake8-unused-arguments (finds dead code)
    "PTH",  # flake8-use-pathlib (encourages modern Path objects)
    "RUF",  # Ruff-specific rules (internal optimizations)
]
ignore = [
    "E501", # Line-length violations (handled better by the formatter)
]
preview = false

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
docstring-code-format = true
